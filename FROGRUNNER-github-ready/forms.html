<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frog Runner - Forms</title>
</head>
<body class="pond">
  <nav class="navbar navbar-expand-lg navbar-dark pond-nav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark" aria-hidden="true"><img src="/src/assets/frog.png" alt="" /></span>
        <span class="fw-semibold">Frog Runner</span>
      </a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-ghost btn-sm nav-pill" href="index.html">Landing</a>
        <a class="btn btn-ghost btn-sm nav-pill" href="game.html">2D Game</a>
        <a class="btn btn-ghost btn-sm nav-pill" href="three.html">3D Pond</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="mb-4">
      <span class="badge rounded-pill badge-leaf mb-2">Validation</span>
      <h2 class="fw-bold mb-2 hero-title">Frog Runner Forms</h2>
      <p class="small-muted mb-0">Three separate forms with JavaScript validation and clear, user-friendly error messages.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card glass-card">
          <div class="card-body">
            <h5 class="fw-semibold">1) Player Profile</h5>
            <form id="regForm" novalidate>
<div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" placeholder="e.g., FroggyMatt" />
                <div class="text-danger form-error" data-for="username"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Age</label>
                <input class="form-control" name="age" type="number" min="1" placeholder="e.g., 18" />
                <div class="text-danger form-error" data-for="age"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Preferred Difficulty</label>
                <select class="form-select" name="difficulty">
                  <option value="">Choose…</option>
                  <option value="easy">Easy</option>
                  <option value="normal">Normal</option>
                  <option value="hard">Hard</option>
                </select>
                <div class="text-danger form-error" data-for="difficulty"></div>
              </div>

              <button class="btn btn-leaf w-100" type="submit">Create Profile</button>
              <div class="alert alert-success mt-3 d-none" id="regOk">Profile created (demo only).</div>
</form>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card glass-card">
          <div class="card-body">
            <h5 class="fw-semibold">2) Feedback</h5>
            <form id="contactForm" novalidate>
<div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" name="email" type="email" placeholder="name@example.com" />
                <div class="text-danger form-error" data-for="email"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Feedback Type</label>
                <select class="form-select" name="type">
                  <option value="">Choose…</option>
                  <option value="bug">Bug Report</option>
                  <option value="suggestion">Suggestion</option>
                  <option value="other">Other</option>
                </select>
                <div class="text-danger form-error" data-for="type"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" rows="4" placeholder="Tell us what happened or what you want improved..."></textarea>
                <div class="text-danger form-error" data-for="message"></div>
              </div>

              <button class="btn btn-ghost w-100" type="submit">Send Feedback</button>
              <div class="alert alert-success mt-3 d-none" id="contactOk">Thanks! Feedback sent (demo only).</div>
</form>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card glass-card">
          <div class="card-body">
            <h5 class="fw-semibold">3) Game Settings</h5>
            <form id="settingsForm" novalidate>
<div class="mb-3">
                <label class="form-label">Sound Volume (0–100)</label>
                <input class="form-control" name="volume" type="number" min="0" max="100" placeholder="e.g., 70" />
                <div class="text-danger form-error" data-for="volume"></div>
              </div>

              <div class="mb-3">
                <label class="form-label">Control Method</label>
                <select class="form-select" name="controls">
                  <option value="">Choose…</option>
                  <option value="keyboard">Keyboard</option>
                  <option value="mouse">Mouse</option>
                </select>
                <div class="text-danger form-error" data-for="controls"></div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="nightMode" name="nightMode" />
                <label class="form-check-label" for="nightMode">Enable Night Mode</label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember" name="remember" />
                <label class="form-check-label" for="remember">Remember my settings</label>
              </div>

              <button class="btn btn-ghost w-100" type="submit">Save Settings</button>
              <div class="alert alert-success mt-3 d-none" id="settingsOk">Saved (demo only).</div>
</form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/pages/formsPage.js"></script>
</body>
</html>
